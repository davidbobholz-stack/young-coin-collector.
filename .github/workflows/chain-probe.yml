name: Chain probe

# Temporary. A push of this file dispatches one short Collect run so we can
# see that run queue its own successor. Deleted after that evidence exists.
on:
  push:
    branches: [cursor/fix-dispatch-chain-22e6]
    paths: ['.github/workflows/chain-probe.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch a 180s collect run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "token_present=$([[ -n "$GH_TOKEN" ]] && echo yes || echo no) repo=$GITHUB_REPOSITORY"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/dispatches" \
            --input - <<'EOF'
          {"ref":"cursor/fix-dispatch-chain-22e6","inputs":{"run_seconds":"180"}}
          EOF
          echo "workflow_dispatch accepted"
