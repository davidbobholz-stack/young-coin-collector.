name: Collect

# Near-continuous collection on the free public-repo Linux runners.
# The schedule is only a safety net. Each run queues the next workflow_dispatch
# immediately, and the concurrency group holds that successor until this job
# exits, so the idle gap is runner startup rather than the cron interval.
# Cron is offset from :00 because scheduled workflows slip the most then.
# A push to main of this file or collector.py starts a run too (so the merge
# that adds this trigger starts the chain). It joins the same concurrency
# group and does not cancel the running job.
# The next run is queued at the end of the job, not the start, so a cron
# tick during the 4 hours cannot replace it and then itself be dropped.
on:
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      run_seconds:
        description: "Seconds to collect this run (60-16200). Default 14400 (4h)."
        required: false
        default: "14400"
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml', 'collector.py']

# Never overlap. A second trigger waits. A third cancels the waiting one,
# which leaves exactly one successor queued behind the running job.
concurrency:
  group: young-coin-collector
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATA_DIR: ${{ github.workspace }}/data-wt
      # The runner does not put the job token in the environment. gh needs it
      # explicitly. permissions.actions: write on this job is what lets that
      # token create the next workflow_dispatch.
      GH_TOKEN: ${{ github.token }}
      # JSON array of wallet addresses. When this secret is set it wins.
      # Otherwise the logger reads config/tracked_wallets.json. It skips
      # only when neither the secret nor that file is present.
      TRACKED_WALLETS: ${{ secrets.TRACKED_WALLETS }}
      # Push and schedule have no inputs. Only a workflow_dispatch value is used;
      # anything else (including a missing input) is the 4 hour default.
      # The successor is dispatched with no inputs, so it always collects for 4 hours.
      RUN_SECONDS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seconds || '14400' }}
      CHECKPOINT_SECONDS: "180"
      COLLECTOR_STOP: ${{ vars.COLLECTOR_STOP }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Prepare data branch
        run: bash scripts/prepare_data_worktree.sh

      - name: Collect and publish
        run: bash scripts/run_actions.sh
